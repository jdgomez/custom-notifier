# Continuous integration. Job names (`verify`, `e2e`) are the required status
# check names in .github/rulesets/main-protection.json: do not rename them
# without updating it in the same change.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default; no job needs more and no secrets are used.
permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
      - name: Build, lint and JVM tests
        run: ./gradlew assembleDebug lintAll test
      - name: Upload reports and screenshot diffs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-reports
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/outputs/roborazzi/
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
      # Compile before the emulator boots so it is not starved of CPU by Gradle
      # (scripts/e2e.sh then only installs and runs).
      - name: Build debug and test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest
      # The runner image ships cmdline-tools 12.0, whose avdmanager writes target=android-0
      # for android-37.0 AVDs; the emulator then crash-loops system_server
      # (ReactiveCircus/android-emulator-runner issue #482). The action only installs its own
      # tools when $ANDROID_HOME/cmdline-tools is missing, so update them here.
      - name: Update Android command-line tools
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "cmdline-tools;22.0"
          # Keep 22.0 in its own expected location and drop the 12.0 copy. The runner action
          # only installs its own tools when cmdline-tools is missing, and its PATH entry for
          # latest/bin then points nowhere, so these tools are the ones it finds.
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/22.0/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/22.0/bin/sdkmanager" --version
      # Same API level and image as the local cn-api37 AVD (docs/development-setup.md).
      - name: Run E2E on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: '37.0'
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          # Same data partition as the local AVDs; the default is too small to install the APKs.
          disk-size: 10G
          emulator-boot-timeout: 600
          # Fail early if avdmanager wrote a wrong target (see the cmdline-tools step above).
          pre-emulator-launch-script: |
            grep -H target $HOME/.android/avd/test.ini $HOME/.android/avd/test.avd/config.ini || true
            grep -x target=android-37.0 $HOME/.android/avd/test.ini
          script: ./scripts/e2e.sh
      - name: Upload E2E video and reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-evidence
          path: build/e2e/
          if-no-files-found: warn
          retention-days: 14
